# The Atlas pipeline: pull headlines, draft missing or stale reports with the Claude API
# (when the ANTHROPIC_API_KEY secret is set), commit any new content to main, publish the
# static site to GitHub Pages and redeploy the enterprise edition when reports changed. Runs on
# every push that touches apps/atlas, every 20 minutes, and on demand.
name: "Atlas: wire, reports, publish"

on:
  push:
    branches: [main]
    paths: ["apps/atlas/**", ".github/workflows/atlas-pages.yml"]
  schedule:
    # Every 20 minutes. GitHub runs scheduled workflows on a best-effort basis and drops many
    # of them on busy hours (hourly ran only 4 times in 15 hours), so three chances an hour
    # keep the site within the hour in practice. Runs never overlap (see concurrency).
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Re-draft auto-drafted reports of developing events older than this many days (0 = only missing ones)"
        default: "7"
      max_reports:
        description: "Cap on reports drafted in this run (0 = no cap)"
        default: "0"
      force_discover:
        description: "Screen the news for new events now, even if the last screen was recent (yes/no)"
        default: "no"
      max_updates:
        description: "Events to write a 'what changed' line, headline and quick take for in this run"
        default: "12"
      max_plain:
        description: "Events to (re)write plain-words summaries for in this run"
        default: "8"
      max_lanes:
        description: "Events to check against shipping routes, borders, airspace and rail corridors in this run"
        default: "8"

permissions:
  contents: write
  id-token: write # lets the job mint a GitHub OIDC token for keyless access to the Claude API

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    env:
      # Credentials for drafting, either of:
      #  - a repository secret ANTHROPIC_API_KEY, or
      #  - workload identity federation: repository *variables* ANTHROPIC_ORGANIZATION_ID,
      #    ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_SERVICE_ACCOUNT_ID (+ ANTHROPIC_WORKSPACE_ID),
      #    set up in the Claude Console (Organization settings → Workload identity → Connect workload →
      #    GitHub Actions, subject repo:neel8636/Geopolitica:ref:refs/heads/main). No key is stored.
      HAS_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
      HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
    defaults:
      run:
        working-directory: apps/atlas
    steps:
      - uses: actions/checkout@v4
        with:
          # the newest main when the job starts, not when it was queued: a run queued behind
          # another one would otherwise start from content that run has since rewritten
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/atlas/package-lock.json
      - run: npm ci --no-audit --no-fund

      - name: Pull the wire
        run: npm run wire || echo "wire fetch failed; building with the committed wire.json"

      - name: New events from the news (only stories that pass the ripple test)
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force_discover || 'no' }}
        run: |
          if [ "$FORCE" = "yes" ]; then npm run discover -- --force; else npm run discover; fi || echo "discovery had failures; publishing what succeeded"

      - name: What changed (a short AI line for events whose news is moving)
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_UPDATES: ${{ github.event.inputs.max_updates || '12' }}
        run: npm run updates -- --max "$MAX_UPDATES" || echo "updates had failures; publishing what succeeded"

      - name: What's fueling it (small events feeding the big ones)
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fuel || echo "fuel had failures; publishing what succeeded"

      - name: Which routes each event disrupts (ports, canals, borders, airspace, rail)
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANES_MAX: ${{ github.event.inputs.max_lanes || '8' }}
        run: npm run lanetags -- --max "$LANES_MAX" || echo "lane checks had failures; publishing what succeeded"

      - name: Explain new connections in plain words
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run explain || echo "explain had failures; publishing what succeeded"

      - name: Write each event's views in plain words
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPLAIN_MAX: ${{ github.event.inputs.max_plain || '8' }}
        run: npm run inplain || echo "plain-words summaries had failures; publishing what succeeded"

      - name: Draft reports
        if: env.HAS_AUTH == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          STALE: ${{ github.event.inputs.stale_days || '7' }}
          MAX: ${{ github.event.inputs.max_reports || '0' }}
        run: |
          EXTRA=""
          if [ "$MAX" != "0" ]; then EXTRA="--max $MAX"; fi
          npm run draft -- --all --stale "$STALE" $EXTRA || echo "drafting had failures; publishing what succeeded"

      - name: Commit new content to main
        id: commit
        run: |
          git config user.name "geopolitica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/wire.json src/content/updates.json src/content/updates-errors.json src/content/fuel.json src/content/fuel-errors.json src/content/lane-tags.json src/content/lane-tags-errors.json src/content/explain.json src/content/explain-public.json src/content/plain.json src/content/inplain.json src/content/events/discovered.json src/content/discovery-log.json src/content/inplain-errors.json src/content/dossiers
          if git diff --cached --quiet -- src/content/dossiers src/content/events/discovered.json; then echo "reports=false" >> "$GITHUB_OUTPUT"; else echo "reports=true" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet; then
            echo "no content changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atlas: wire and reports refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The enterprise edition reads the same events and reports, so it is redeployed from here:
      # on every push that touches apps/atlas (the Render workflow stands aside for those, so
      # there is exactly one deploy, with any newly drafted reports in it), and on scheduled
      # runs only when reports changed, since headlines change every hour and an hourly rebuild
      # would use up Render's free build minutes.
      - name: Redeploy the enterprise edition
        if: (github.event_name == 'push' || steps.commit.outputs.reports == 'true') && env.HAS_HOOK == 'true'
        run: curl -sS -o /dev/null -w "Render answered %{http_code}\n" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /${{ github.event.repository.name }}
          # the enterprise server that generates reports on demand from an event page
          NEXT_PUBLIC_REPORT_API: ${{ vars.REPORT_API || 'https://geopolitica-1rja.onrender.com' }}
          # Reader sign-up (Firebase project geopolitica-941b0). The web config is public by design
          # (it names the project; Auth and the Firestore rules do the protecting). Repository
          # variables of the same names override these defaults.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || 'AIzaSyA_bnPFuNY131FtUrpsEgkonFPyKwMnuzs' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || 'geopolitica-941b0.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'geopolitica-941b0' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || '1:600266158045:web:1a40696fc81a511add1034' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || 'geopolitica-941b0.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || '600266158045' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID || 'G-HNQBF1FW1B' }}
        run: npm run build

      # Pushing the build to a gh-pages branch is what Pages serves (Settings → Pages → gh-pages, root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/atlas/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish atlas from ${{ github.sha }}"
