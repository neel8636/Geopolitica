# Keeps the Atlas refreshing about once an hour. GitHub's own timer (the cron in
# atlas-pages.yml) is best effort and on busy days runs only every few hours, so this job
# starts the refresh itself: every hour it checks when the last Atlas run started, and starts
# one if none has in the past 50 minutes. After about five hours it hands over to a fresh copy
# of itself. The cron below restarts the chain if it ever stops. Free on a public repo.
name: "Atlas: hourly heartbeat"

on:
  workflow_dispatch:
  # PAUSED (Nov 2026, Claude API credits ran out). To resume: uncomment the schedule and set
  # PAUSED to "false" below, and in atlas-pages.yml.
  # schedule:
  #   - cron: "41 */3 * * *"

permissions:
  actions: write
  contents: read

# one heartbeat at a time; a second one waits (and is replaced by any newer one) instead of running alongside
concurrency:
  group: atlas-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PAUSED: "true"
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Start the Atlas refresh about once an hour
        run: |
          if [ "$PAUSED" = "true" ]; then echo "Geopolitica is paused; no refresh started."; exit 0; fi
          start_if_due() {
            info=$(gh api "repos/$REPO/actions/workflows/atlas-pages.yml/runs?per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.created_at)"' || echo "unknown 1970-01-01T00:00:00Z")
            status=${info%% *}; created=${info#* }
            age=$(( $(date -u +%s) - $(date -u -d "$created" +%s) ))
            if [ "$status" != "completed" ]; then echo "an Atlas run is $status; skipping"; return; fi
            if [ "$age" -lt 3000 ]; then echo "last Atlas run started $((age / 60)) min ago; skipping"; return; fi
            gh workflow run atlas-pages.yml -R "$REPO" --ref main && echo "started an Atlas refresh (last one was $((age / 60)) min ago)"
          }
          for beat in 1 2 3 4 5; do
            start_if_due
            [ "$beat" -lt 5 ] && sleep 3600
          done
      - name: Hand over to a fresh heartbeat
        if: ${{ !cancelled() && env.PAUSED != 'true' }}
        run: gh workflow run heartbeat.yml -R "$REPO" --ref main
